services:
  - type: web
    name: smell-panties-free-preview
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_STORAGE_DIR
        value: /tmp/smell-panties-preview
      - key: COOKIE_SECURE
        value: "true"
      - key: FREE_RENDER_PREVIEW
        value: "true"
      - key: BILLING_MODE
        value: launch_free
      - key: SEED_DEMO_DATA
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "10"
