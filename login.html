{% extends "base.html" %}
{% block title %}Log in — Smell Panties{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <img class="auth-logo" src="{{ url_for('static', filename='sp_logo.png') }}" alt="Smell Panties">
    <div class="eyebrow">WELCOME BACK</div><h1>Log in</h1><p>Subscribers and creators use the same secure login.</p>
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next_url }}">
      <label><span>Email</span><input type="text" name="email" autocomplete="username" placeholder="you@example.com" required></label>
      <label><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
      <button class="button wide" type="submit">Log in</button>
    </form>
    <div class="auth-links"><a href="{{ url_for('signup', next=next_url) }}">Create subscriber account</a><a href="{{ url_for('creator_signup') }}">Become a creator</a></div>
  </div>
</section>
{% endblock %}
